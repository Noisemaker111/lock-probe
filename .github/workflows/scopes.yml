name: scopes
on: workflow_dispatch
permissions: read-all
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: probe writes with a read-only token
        run: |
          set -x
          gh api -X POST /repos/$GITHUB_REPOSITORY/issues -f title=probe1 -f body=x -i | head -1 || true
          echo '{"message":"probe","content":"aGk="}' > /tmp/c.json
          gh api -X PUT /repos/$GITHUB_REPOSITORY/contents/probe.txt -i --input /tmp/c.json | head -1 || true
          gh api -X POST /repos/$GITHUB_REPOSITORY/releases -f tag_name=probe-r1 -f name=probe | head -1 || true
          gh api -X POST /repos/$GITHUB_REPOSITORY/actions/workflows/probe.yml/dispatches -f ref=main -i | head -1 || true
          gh api -X POST /repos/$GITHUB_REPOSITORY/merge-upstream -f branch=main -i | head -1 || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
